apiVersion: v1
kind: Secret
metadata:
  name: catalog-secret
  namespace: fcg-apps
  labels:
    app: catalog-api
stringData:
  # Placeholders for sensitive configuration values
  # Database connection string 
  ConnectionStrings__DefaultConnection: "Server=sqlserver-service;Database=CatalogDb;User Id=sa;Password=YOUR_PASSWORD;TrustServerCertificate=True;Encrypt=False;"
  # RabbitMQ credentials
  RabbitMq__UserName: "guest"
  RabbitMq__Password: "guest"
  # JWT sensitive secret
  Jwt__Secret: "your-256-bit-secret"